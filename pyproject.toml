[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advancedrawio"
version = "0.1.0"
description = "MCP server para diagramas draw.io avanzados: layout ELK, zonas anidadas, iconos oficiales y capas interactivas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
advancedrawio = "advancedrawio.server:main"
advancedrawio-build = "advancedrawio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/advancedrawio"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]  # `l` para capas (layers) es la convención del código

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # fixtures XML en una línea

[tool.pytest.ini_options]
testpaths = ["tests"]
