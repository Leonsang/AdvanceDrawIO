name: Nuevo tipo de diagrama o iconos
description: Un tipo de diagrama, una librería de stencils o un icono que falta.
labels: [catalogo]
body:
  - type: input
    id: tipo
    attributes:
      label: Tipo o librería
      placeholder: p. ej. diagramas de red Fortinet, iconos de Vertex AI
    validations:
      required: true
  - type: textarea
    id: referencia
    attributes:
      label: Ejemplo de referencia
      description: Un diagrama de draw.io bien hecho de ese tipo (enlace o archivo). El agente copia estilos de ejemplos reales, así que esto es lo que más ayuda.
    validations:
      required: true
