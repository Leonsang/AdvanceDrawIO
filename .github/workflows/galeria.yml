name: galería

# Regenera docs/galeria (PNG, .drawio y tabla de revisión) con draw.io real y lo commitea en la
# rama. Corre cuando cambian los ejemplos o el código, o a mano (Actions → galería → Run workflow).
# El commit del bot lleva [skip ci]: el CI ya validó el commit que lo originó, y así el PR no
# queda con un run pendiente de aprobación.
on:
  workflow_dispatch:
  push:
    paths:
      - "examples/**"
      - "src/advancedrawio/**"
      - "scripts/galeria.py"
      - ".github/workflows/galeria.yml"

permissions:
  contents: write

concurrency:
  group: galeria-${{ github.ref }}
  cancel-in-progress: true

jobs:
  galeria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: draw.io Desktop + paquete
        run: bash scripts/setup-cloud.sh
      - name: construir la galería
        run: .venv/bin/python scripts/galeria.py -o "$RUNNER_TEMP/galeria"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          # si la rama recibió cambios de código después de este commit, esta galería ya es vieja:
          # el run del commit nuevo la publica
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- . ':(exclude)docs/galeria'; then
            echo "la rama avanzó; no publico una galería vieja"; exit 0
          fi
          git reset -q --hard FETCH_HEAD
          rm -rf docs/galeria && cp -r "$RUNNER_TEMP/galeria" docs/galeria
          git add -A docs/galeria
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Galería regenerada [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
