name: release

# Al publicar un tag vX.Y.Z: construye wheel y sdist y crea el release de GitHub con las notas
# de release-notes/vX.Y.Z.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: la versión del tag coincide con pyproject.toml
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != versión $v"; exit 1; }
          test -f "release-notes/$GITHUB_REF_NAME.md"
      - run: pip install build && python -m build
      - name: crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "AdvanceDrawIO $GITHUB_REF_NAME" --notes-file "release-notes/$GITHUB_REF_NAME.md"
